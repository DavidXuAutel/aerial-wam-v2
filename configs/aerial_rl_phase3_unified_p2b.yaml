# Aerial WAM Phase-3 — P2b outdoor-preserving fusion FT
#
# Context (2026-09-12):
#   P2a (handover 44ep, uniform replay) → outdoor SR 0/16, d_min~28m stall.
#   Phase-2 toward_g baseline on same eval → 13/16 (81.2%).
# P2b mitigations:
#   - Warm-start Phase-2 toward_g (NOT the regressed P2a ckpt).
#   - Outdoor-heavy replay dataset (~90% outdoor via symlink oversampling).
#   - Shorter FT (300 iter) to limit indoor drift.
#   - Post-train outdoor regression gate (see eval_phase3_outdoor_regression_gate.sh).
#
# Build replay dataset (125):
#   python -m experiments.aerial.scripts.build_phase3_p2b_replay_dataset \
#     --mode outdoor_heavy
#
# Train (125 → H100):
#   bash experiments/aerial/scripts/train_phase3_unified_p2b.sh

scene_mix:
  outdoor_prob: 0.9
  indoor_prob: 0.1
  cross_scene_in_episode: false
  require_scene_tag: true

scene_profiles:
  outdoor_approach:
    action_limits:
      max_dx: 1.0
      max_dy: 0.4
      max_dz: 0.4
      max_dyaw: 0.314
    success_dist_m: 3.0
    safety:
      kind: three_zone
      l1_m: 8.0
      l2_m: 5.0
      l3_m: 1.5
      v1_m_s: 2.0
      v2_m_s: 1.0
      v_stop_m_s: 0.2
      v_cruise_m_s: 10.0
      a_max_m_s2: 2.5
      delay_s: 0.2
  outdoor_long:
    action_limits:
      max_dx: 1.0
      max_dy: 0.4
      max_dz: 0.4
      max_dyaw: 0.314
    success_dist_m: 3.0
    safety:
      kind: three_zone
      l1_m: 8.0
      l2_m: 5.0
      l3_m: 1.5
      v1_m_s: 2.0
      v2_m_s: 1.0
      v_stop_m_s: 0.2
      v_cruise_m_s: 25.0
      a_max_m_s2: 2.5
      delay_s: 0.2
  indoor_micro:
    action_limits:
      max_dx: 0.15
      max_dy: 0.08
      max_dz: 0.08
      max_dyaw: 0.10
    success_dist_m: 0.5
    safety:
      kind: three_zone
      l1_m: 1.5
      l2_m: 0.8
      l3_m: 0.4
      v1_m_s: 0.6
      v2_m_s: 0.3
      v_stop_m_s: 0.05
      v_cruise_m_s: 1.0
      a_max_m_s2: 1.5
      delay_s: 0.1

pose_contract:
  pose_source_required: true
  forbid_gt_world_pose_control: true
  forbid_silent_gt_goal_rel: true
  train_allow_gt_proxy: true
  eval_allow_gt_proxy: false

env:
  backend: airsim
  host: 127.0.0.1
  port: 41451
  camera: front_custom
  vehicle: drone_1
  width: 224
  height: 224
  step_hz: 5.0
  grab_depth: false
  health_check: true
  seed: 0

buffer:
  capacity_episodes: 2000
  seed: 0

reward:
  w_progress: 1.0
  w_collision: 10.0
  w_maneuver: 0.01
  success_bonus: 10.0
  success_dist_m: 3.0

dynamics:
  kind: torch
  latent_dim: 8
  collide_radius_m: 2.0

world_model:
  checkpoint_dir: experiments/aerial/rl/artifacts/wm_ckpt_d_full_20260828

imagination:
  batch: 64
  horizon: 10

planner:
  enable: false
  horizon: 5

corrector:
  iterations: 10
  episodes_per_iter: 1
  max_steps: 200
  enable_wm_update: false
  enable_policy_update: false
  strict_gates: false
  wm_batch: 32
  wm_window: 8
  smoke: false

v4:
  lambda_gae: 0.95
  gamma: 0.997
  entropy_scale: 3.0e-4
  actor_lr: 1.0e-4
  critic_lr: 1.0e-4
  action_scale: 1.0
  device: cpu

report_required_fields:
  - scene
  - controller_attribution
  - sensors_used
  - pose_source
  - used_gt_world_pose_for_control
  - goal_rel_pose_source
  - success_dist_m

annotation: experiments/aerial/phase3_unified/annotations/handover_seen_filtered.json
dataset: experiments/aerial/rl/artifacts/dataset_phase3_p2b_outdoor_heavy
max_episodes: 0

p2b:
  warm_start: experiments/aerial/rl/artifacts/v4_ac_ckpt_phase2_toward_g_20260905_112006/v4_ac_latest.pt
  regression_baseline: artifacts/phase3_unified_eval_20260911/outdoor_long_eval_phase2_baseline.json
  min_arrival_rate: 0.7125
  min_arrivals: 11
  delta_vs_baseline: 0.10

safety:
  kind: three_zone
  l1_m: 8.0
  l2_m: 5.0
  l3_m: 1.5
  v1_m_s: 2.0
  v2_m_s: 1.0
  v_stop_m_s: 0.2
  v_cruise_m_s: 25.0
  a_max_m_s2: 2.5
  delay_s: 0.2
  min_tau_s: 1.0
  max_p_coll: 0.5
  retreat_step_m: 3.0
