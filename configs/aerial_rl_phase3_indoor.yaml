# Aerial WAM Phase-3 — P3-indoor (decouple path, indoor-only)
#
# Outdoor π stays frozen (Phase-2 toward_g). This config trains a separate
# indoor ckpt on Building_99 rollouts only — no outdoor npz, no mixed replay.
#
#   bash experiments/aerial/scripts/train_phase3_indoor.sh

scene_mix:
  outdoor_prob: 0.0
  indoor_prob: 1.0
  cross_scene_in_episode: false
  require_scene_tag: true
  allowed_scenes:
    - indoor_micro

scene_profiles:
  indoor_micro:
    action_limits:
      max_dx: 0.15
      max_dy: 0.08
      max_dz: 0.08
      max_dyaw: 0.10
    success_dist_m: 0.5
    safety:
      kind: three_zone
      l1_m: 1.5
      l2_m: 0.8
      l3_m: 0.4
      v1_m_s: 0.6
      v2_m_s: 0.3
      v_stop_m_s: 0.05
      v_cruise_m_s: 1.0
      a_max_m_s2: 1.5
      delay_s: 0.1

pose_contract:
  pose_source_required: true
  forbid_gt_world_pose_control: true
  forbid_silent_gt_goal_rel: true
  train_allow_gt_proxy: true
  eval_allow_gt_proxy: true

env:
  backend: airsim
  host: 127.0.0.1
  port: 41451
  camera: front_custom
  vehicle: drone_1
  width: 224
  height: 224
  step_hz: 5.0
  grab_depth: false
  health_check: true
  seed: 0
  map_id: building_99

buffer:
  capacity_episodes: 2000
  seed: 0

reward:
  w_progress: 1.0
  w_collision: 10.0
  w_maneuver: 0.01
  success_bonus: 10.0
  success_dist_m: 0.5

dynamics:
  kind: torch
  latent_dim: 8
  collide_radius_m: 0.8

world_model:
  checkpoint_dir: experiments/aerial/rl/artifacts/wm_ckpt_d_full_20260828

imagination:
  batch: 32
  horizon: 8

planner:
  enable: false
  horizon: 5

corrector:
  iterations: 10
  episodes_per_iter: 0
  max_steps: 60
  enable_wm_update: false
  enable_policy_update: false
  strict_gates: false
  wm_batch: 32
  wm_window: 8
  smoke: false

v4:
  lambda_gae: 0.95
  gamma: 0.997
  entropy_scale: 2.0e-4
  actor_lr: 5.0e-5
  critic_lr: 5.0e-5
  action_scale: 1.0
  device: cpu

report_required_fields:
  - scene
  - map_id
  - controller_attribution
  - sensors_used
  - pose_source
  - used_gt_world_pose_for_control
  - goal_rel_pose_source
  - success_dist_m

annotation: experiments/aerial/phase3_unified/annotations/phase3_indoor_seen.json
dataset: experiments/aerial/rl/artifacts/dataset_phase3_indoor_seen
max_episodes: 0

p3_indoor:
  renderer: building99
  map_id: building_99
  scene: indoor_micro
  warm_start: experiments/aerial/rl/artifacts/v4_ac_ckpt_phase2_toward_g_20260905_112006/v4_ac_latest.pt
  iters: 200
  forbid_outdoor_npz: true

safety:
  kind: three_zone
  l1_m: 1.5
  l2_m: 0.8
  l3_m: 0.4
  v1_m_s: 0.6
  v2_m_s: 0.3
  v_stop_m_s: 0.05
  v_cruise_m_s: 1.0
  a_max_m_s2: 1.5
  delay_s: 0.1
  min_tau_s: 0.5
  max_p_coll: 0.5
  retreat_step_m: 0.5
